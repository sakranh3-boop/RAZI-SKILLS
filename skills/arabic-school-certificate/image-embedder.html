<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>أداة تضمين خلفية الشهادة</title>
<style>
body { font-family: Arial; background: #fdf6e3; padding: 40px; text-align: center; direction: rtl; }
.box { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
h1 { color: #855E42; }
label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 18px; }
input { margin: 10px 0; }
button { background: #d9a066; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
button:hover { background: #c48942; }
.status { margin-top: 15px; color: #2e7d32; font-weight: bold; }
img.preview { max-width: 200px; margin: 10px; border: 2px solid #ccc; border-radius: 8px; }
</style>
</head>
<body>
<div class="box">
<h1>أداة تضمين خلفية الشهادة</h1>
<p>ارفعي صورة الخلفية ثم اضغطي الزر لتحميل ملف الشهادة النهائي</p>

<label>خلفية الشهادة:</label>
<input type="file" id="bgFile" accept="image/*">
<img id="bgPreview" class="preview" style="display:none">

<br>
<button onclick="generateFile()">إنشاء ملف الشهادة النهائي</button>
<div class="status" id="status"></div>
</div>

<script>
var bgData = '';

document.getElementById('bgFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    bgData = ev.target.result;
    document.getElementById('bgPreview').src = bgData;
    document.getElementById('bgPreview').style.display = 'inline';
  };
  reader.readAsDataURL(file);
});

function generateFile() {
  if (!bgData) { alert('الرجاء رفع صورة الخلفية أولاً'); return; }

  var p = [];
  p.push('<!DOCTYPE html>');
  p.push('<html lang="ar" dir="rtl">');
  p.push('<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">');
  p.push('<title>شهادة صناع الأمل</title>');
  p.push('<style>');
  p.push('body{font-family:Arial;background:#fdf6e3;margin:0;direction:rtl}');
  p.push('.container{max-width:1150px;margin:auto;padding:20px}');
  p.push('h1{text-align:center;color:#855E42}');
  p.push('form{background:#fff3e0;padding:20px;border-radius:10px}');
  p.push('label{display:inline-block;margin:5px 0}');
  p.push('input[type="text"],input[type="date"]{padding:5px;width:200px}');
  p.push('table{width:100%;border-collapse:collapse;margin:10px 0}');
  p.push('th,td{border:1px solid #855E42;padding:6px;text-align:center}');
  p.push('th{background:#f5deb3}');
  p.push('button{background:#d9a066;color:#fff;padding:10px 20px;border:none;margin:5px;border-radius:5px;cursor:pointer;font-size:16px}');
  p.push('.certificate{width:1123px;height:794px;position:relative;margin:20px auto;display:none;overflow:hidden;background:white;border-radius:15px;box-shadow:0 0 15px rgba(170,130,90,0.4);direction:rtl}');
  p.push('.bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:1;z-index:0}');
  p.push('.content{position:absolute;z-index:1;top:16%;left:20%;width:58%;height:42%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;direction:rtl;padding:0 10px}');
  p.push('.content h2{color:#6B4E71;margin:3px 0;font-size:24px}');
  p.push('.content h3{color:#855E42;margin:3px 0;font-size:17px}');
  p.push('.student-name{font-size:19px;font-weight:bold;color:#6B4E71;margin:5px 0}');
  p.push('.cert-class{font-size:15px;margin:3px 0}');
  p.push('.cert-date{font-size:15px;margin:3px 0}');
  p.push('.content table{direction:rtl;width:100%;margin:5px 0}');
  p.push('.content th,.content td{font-size:12px;padding:3px 4px;direction:rtl;text-align:center;border:1px solid #855E42}');
  p.push('.content th{background:rgba(245,222,179,0.7)}');
  p.push('.content td{background:rgba(255,255,255,0.5)}');
  p.push('.content td.check{color:#2e7d32;font-size:15px;font-weight:bold}');
  p.push('.message{padding:2px;white-space:pre-line;font-size:14px;font-weight:bold;color:#6B4E71;line-height:1.6;width:100%;margin:5px 0;direction:rtl;text-align:center}');
  p.push('.signature{display:flex;justify-content:space-between;width:58%;direction:rtl;position:absolute;bottom:22%;left:20%;z-index:1}');
  p.push('.sig-right{text-align:center;font-size:14px}');
  p.push('.sig-left{text-align:center;font-size:14px;font-weight:bold}');
  p.push('@media print{form,h1,button,.saved-note{display:none!important}.certificate{box-shadow:none;display:block!important;margin:0;border-radius:0}.container{padding:0;max-width:100%}body{background:white}}');
  p.push('</style></head><body><div class="container">');
  p.push('<h1>نموذج تقييم الطالب - مدرسة بسمة طبعون الابتدائية</h1>');
  p.push('<form>');
  p.push('<label>اسم الطالب: <input type="text" id="studentName"></label><br>');
  p.push('<label>الصف: <input type="text" id="className"></label><br>');
  p.push('<label>التاريخ: <input type="date" id="dateField"></label><br>');
  p.push('<label>اسم المربي/ة: <input type="text" id="teacherName"></label><br>');
  p.push('<table id="evalTable"><thead>');
  p.push('<tr><th>الموضوع</th><th colspan="3">المشاركة</th><th colspan="3">إنجاز المهام</th></tr>');
  p.push('<tr><th></th><th>كامل</th><th>جزئي</th><th>لا يشارك</th><th>ينفذ بالكامل</th><th>ينفذ جزئيًا</th><th>لا ينفذ</th></tr>');
  p.push('</thead><tbody id="evalBody">');
  var subjects = ['اللغة العربية','اللغة العبرية','اللغة الإنجليزية','رياضيات','علوم'];
  for (var s = 0; s < subjects.length; s++) {
    p.push('<tr><td>'+subjects[s]+'</td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td></tr>');
  }
  p.push('</tbody></table>');
  p.push('<button type="button" onclick="generate()">إنشاء الشهادة</button>');
  p.push('<button type="button" onclick="download()">تحميل PDF</button>');
  p.push('<button type="button" onclick="window.print()">طباعة / حفظ PDF</button>');
  p.push('</form>');
  p.push('<div id="cert" class="certificate">');
  p.push('<img class="bg" src="' + bgData + '">');
  p.push('<div class="content">');
  p.push('<h2>مدرسة بسمة طبعون الابتدائية</h2>');
  p.push('<h3>شهادة صناع الأمل في حرب زئير الأسد للفصل الثاني 2026</h3>');
  p.push('<div class="student-name" id="certStudent"></div>');
  p.push('<div class="cert-class" id="certClass"></div>');
  p.push('<div class="cert-date" id="certDate"></div>');
  p.push('<table id="certResult"></table>');
  p.push('<div class="message" id="certMsg"></div>');
  p.push('</div>');
  p.push('<div class="signature">');
  p.push('<div class="sig-right"><div>توقيع المربي/ة</div><div id="certTeacher"></div></div>');
  p.push('<div class="sig-left"><div>توقيع المديرة</div><div>سلوى نعراني</div></div>');
  p.push('</div>');
  p.push('</div></div>');

  p.push('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></scr'+'ipt>');
  p.push('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></scr'+'ipt>');
  p.push('<scr'+'ipt>');
  p.push('document.querySelectorAll("#evalBody tr").forEach(function(row){');
  p.push('var boxes=row.querySelectorAll("input[type=checkbox]");');
  p.push('var a=[boxes[0],boxes[1],boxes[2]],b=[boxes[3],boxes[4],boxes[5]];');
  p.push('a.forEach(function(c){c.onclick=function(){a.forEach(function(x){if(x!==c)x.checked=false})}});');
  p.push('b.forEach(function(c){c.onclick=function(){b.forEach(function(x){if(x!==c)x.checked=false})}});');
  p.push('});');
  p.push('function generate(){');
  p.push('var name=document.getElementById("studentName").value;');
  p.push('var cls=document.getElementById("className").value;');
  p.push('var dt=document.getElementById("dateField").value;');
  p.push('var teacher=document.getElementById("teacherName").value;');
  p.push('if(!name||!cls||!dt||!teacher){alert("الرجاء تعبئة جميع الحقول");return}');
  p.push('document.getElementById("certStudent").innerText="فارس/ة التحدي والإرادة، الطالب/ة: "+name;');
  p.push('document.getElementById("certClass").innerText="الصف: "+cls;');
  p.push('document.getElementById("certDate").innerText="التاريخ: "+dt;');
  p.push('document.getElementById("certTeacher").innerText=teacher;');
  p.push('var result=document.getElementById("certResult");');
  p.push('result.innerHTML="<tr><th>الموضوع</th><th colspan=3>المشاركة</th><th colspan=3>إنجاز المهام</th></tr><tr><th></th><th>كامل</th><th>جزئي</th><th>لا يشارك</th><th>ينفذ بالكامل</th><th>ينفذ جزئيًا</th><th>لا ينفذ</th></tr>";');
  p.push('document.querySelectorAll("#evalBody tr").forEach(function(row){');
  p.push('var cells=row.querySelectorAll("td");');
  p.push('var boxes=row.querySelectorAll("input[type=checkbox]");');
  p.push('var tr="<tr><td><strong>"+cells[0].innerText+"</strong></td>";');
  p.push('for(var i=0;i<6;i++){tr+=boxes[i].checked?\'<td class="check">&#10004;</td>\':"<td></td>"}');
  p.push('tr+="</tr>";result.innerHTML+=tr});');
  p.push('var msg="عزيزي الطالب/ عزيزتي الطالبة\\n\\n";');
  p.push('msg+="بإرادتك تثبت أنك أقوى من كل الظروف وأن إصرارك يزرع الأمل.\\n";');
  p.push('msg+="اعلم أن مشاركتك عن بعد ليست مجرد متابعة للدراسة، بل هي قصة شجاعة وصمود نحو النجاح.\\n";');
  p.push('msg+="لا تتخلَّ عن أحلامك ومستقبلك\\n\\n";');
  p.push('msg+="مديرة المدرسة\\n";');
  p.push('msg+="سلوى نعراني";');
  p.push('document.getElementById("certMsg").innerText=msg;');
  p.push('document.getElementById("cert").style.display="block";');
  p.push('document.getElementById("cert").scrollIntoView({behavior:"smooth"})');
  p.push('}');
  p.push('function download(){');
  p.push('var cert=document.getElementById("cert");');
  p.push('if(cert.style.display==="none"){alert("أنشئ الشهادة أولاً");return}');
  p.push('var btn=event.target;btn.innerText="جاري التحميل...";btn.disabled=true;');
  p.push('html2canvas(cert,{scale:2,useCORS:true,allowTaint:true,width:1123,height:794,scrollX:0,scrollY:-window.scrollY}).then(function(canvas){');
  p.push('try{var imgData=canvas.toDataURL("image/jpeg",0.9);');
  p.push('var jsPDF=window.jspdf.jsPDF;');
  p.push('var pdf=new jsPDF({orientation:"landscape",unit:"px",format:[1123,794]});');
  p.push('pdf.addImage(imgData,"JPEG",0,0,1123,794);');
  p.push('pdf.save("شهادة الطالب.pdf")}catch(e){var link=document.createElement("a");link.download="شهادة الطالب.png";link.href=canvas.toDataURL("image/png");link.click()}');
  p.push('btn.innerText="تحميل PDF";btn.disabled=false}).catch(function(){alert("حدث خطأ. جرب من الكمبيوتر.");btn.innerText="تحميل PDF";btn.disabled=false});');
  p.push('}');
  p.push('</scr'+'ipt></body></html>');

  var html = p.join('\n');
  var blob = new Blob([html], { type: 'text/html; charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
  document.getElementById('status').innerText = 'تم إنشاء الملف! اسمه index.html - ارفعيه لريبو roro';
}
</script>
</body>
</html>
