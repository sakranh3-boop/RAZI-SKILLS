<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة تضمين خلفية الشهادة</title>
<style>
body { font-family: Arial; background: #fdf6e3; padding: 20px; text-align: center; direction: rtl; }
.box { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
h1 { color: #855E42; font-size: 22px; }
label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 18px; }
input { margin: 10px 0; }
button { background: #d9a066; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; display: block; width: 100%; }
button:hover { background: #c48942; }
.status { margin-top: 15px; color: #2e7d32; font-weight: bold; }
.error { margin-top: 15px; color: red; font-weight: bold; }
img.preview { max-width: 200px; margin: 10px; border: 2px solid #ccc; border-radius: 8px; }
#downloadLink { display: none; background: #2e7d32; color: white; padding: 15px 30px; font-size: 18px; border-radius: 8px; text-decoration: none; margin-top: 15px; display: none; }
</style>
</head>
<body>
<div class="box">
<h1>أداة تضمين خلفية الشهادة</h1>
<p>ارفعي صورة الخلفية ثم اضغطي الزر</p>

<label>خلفية الشهادة:</label>
<input type="file" id="bgFile" accept="image/*">
<img id="bgPreview" class="preview" style="display:none">

<button id="genBtn" onclick="generateFile()">إنشاء ملف الشهادة النهائي</button>
<a id="downloadLink" href="#">اضغطي هنا لتحميل الملف</a>
<div class="status" id="status"></div>
<div class="error" id="error"></div>
</div>

<script>
var bgData = '';

document.getElementById('bgFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  document.getElementById('error').innerText = '';
  var reader = new FileReader();
  reader.onload = function(ev) {
    bgData = ev.target.result;
    document.getElementById('bgPreview').src = bgData;
    document.getElementById('bgPreview').style.display = 'inline';
  };
  reader.onerror = function() {
    document.getElementById('error').innerText = 'خطأ في قراءة الملف';
  };
  reader.readAsDataURL(file);
});

function generateFile() {
  if (!bgData) { alert('الرجاء رفع صورة الخلفية أولاً'); return; }

  document.getElementById('genBtn').innerText = 'جاري الإنشاء...';
  document.getElementById('error').innerText = '';

  try {
    var html = buildHTML();
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);

    // show download link for mobile
    var link = document.getElementById('downloadLink');
    link.href = url;
    link.download = 'index.html';
    link.style.display = 'block';
    link.innerText = 'اضغطي هنا لتحميل الملف';

    // also try auto download
    var a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    document.getElementById('status').innerText = 'تم! إذا لم يتحمل تلقائياً اضغطي الرابط أعلاه';
    document.getElementById('genBtn').innerText = 'إنشاء ملف الشهادة النهائي';
  } catch(e) {
    document.getElementById('error').innerText = 'خطأ: ' + e.message;
    document.getElementById('genBtn').innerText = 'إنشاء ملف الشهادة النهائي';
  }
}

function buildHTML() {
  var s = '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>شهادة صناع الأمل</title>\n<style>\n';
  s += 'body{font-family:Arial;background:#fdf6e3;margin:0;direction:rtl}\n';
  s += '.container{max-width:1150px;margin:auto;padding:20px}\n';
  s += 'h1{text-align:center;color:#855E42}\n';
  s += 'form{background:#fff3e0;padding:20px;border-radius:10px}\n';
  s += 'label{display:inline-block;margin:5px 0}\n';
  s += 'input[type="text"],input[type="date"]{padding:5px;width:200px}\n';
  s += 'table{width:100%;border-collapse:collapse;margin:10px 0}\n';
  s += 'th,td{border:1px solid #855E42;padding:6px;text-align:center}\n';
  s += 'th{background:#f5deb3}\n';
  s += 'button{background:#d9a066;color:#fff;padding:10px 20px;border:none;margin:5px;border-radius:5px;cursor:pointer;font-size:16px}\n';
  s += '.certificate{width:1123px;height:794px;position:relative;margin:20px auto;display:none;overflow:hidden;background:white;border-radius:15px;box-shadow:0 0 15px rgba(170,130,90,0.4);direction:rtl}\n';
  s += '.bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:1;z-index:0}\n';
  s += '.content{position:absolute;z-index:1;top:16%;left:28%;width:58%;height:60%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;direction:rtl;padding:0 10px}\n';
  s += '.content h2{color:#6B4E71;margin:3px 0;font-size:24px}\n';
  s += '.content h3{color:#855E42;margin:3px 0;font-size:17px}\n';
  s += '.student-name{font-size:19px;font-weight:bold;color:#6B4E71;margin:5px 0}\n';
  s += '.cert-class{font-size:15px;margin:3px 0}\n';
  s += '.cert-date{font-size:15px;margin:3px 0}\n';
  s += '.content table{direction:rtl;width:100%;margin:5px 0}\n';
  s += '.content th,.content td{font-size:12px;padding:3px 4px;direction:rtl;text-align:center;border:1px solid #855E42}\n';
  s += '.content th{background:rgba(245,222,179,0.7)}\n';
  s += '.content td{background:rgba(255,255,255,0.5)}\n';
  s += '.content td.check{color:#2e7d32;font-size:15px;font-weight:bold}\n';
  s += '.message{padding:2px;white-space:pre-line;font-size:14px;font-weight:bold;color:#6B4E71;line-height:1.6;width:100%;margin:5px 0;direction:rtl;text-align:center}\n';
  s += '.signature{display:flex;justify-content:space-around;width:100%;direction:rtl;margin-top:auto}\n';
  s += '.sig-right{text-align:center;font-size:14px}\n';
  s += '.sig-left{text-align:center;font-size:14px;font-weight:bold}\n';
  s += '@media print{form,h1,button{display:none!important}.certificate{box-shadow:none;display:block!important;margin:0;border-radius:0}.container{padding:0;max-width:100%}body{background:white}}\n';
  s += '</style>\n</head>\n<body>\n<div class="container">\n';
  s += '<h1>نموذج تقييم الطالب - مدرسة بسمة طبعون الابتدائية</h1>\n';
  s += '<form>\n';
  s += '<label>اسم الطالب: <input type="text" id="studentName"></label><br>\n';
  s += '<label>الصف: <input type="text" id="className"></label><br>\n';
  s += '<label>التاريخ: <input type="date" id="dateField"></label><br>\n';
  s += '<label>اسم المربي/ة: <input type="text" id="teacherName"></label><br>\n';
  s += '<table id="evalTable"><thead>\n';
  s += '<tr><th>الموضوع</th><th colspan="3">المشاركة</th><th colspan="3">إنجاز المهام</th></tr>\n';
  s += '<tr><th></th><th>كامل</th><th>جزئي</th><th>لا يشارك</th><th>ينفذ بالكامل</th><th>ينفذ جزئيًا</th><th>لا ينفذ</th></tr>\n';
  s += '</thead><tbody id="evalBody">\n';
  var subjects = ['اللغة العربية','اللغة العبرية','اللغة الإنجليزية','رياضيات','علوم'];
  for (var i = 0; i < subjects.length; i++) {
    s += '<tr><td>' + subjects[i] + '</td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td></tr>\n';
  }
  s += '</tbody></table>\n';
  s += '<button type="button" onclick="generate()">إنشاء الشهادة</button>\n';
  s += '<button type="button" onclick="saveAsImage()">حفظ كصورة</button>\n';
  s += '</form>\n';
  s += '<div id="cert" class="certificate">\n';
  s += '<img class="bg" src="' + bgData + '">\n';
  s += '<div class="content">\n';
  s += '<h2>مدرسة بسمة طبعون الابتدائية</h2>\n';
  s += '<h3>شهادة صناع الأمل في حرب زئير الأسد للفصل الثاني 2026</h3>\n';
  s += '<div class="student-name" id="certStudent"></div>\n';
  s += '<div class="cert-class" id="certClass"></div>\n';
  s += '<div class="cert-date" id="certDate"></div>\n';
  s += '<table id="certResult"></table>\n';
  s += '<div class="message" id="certMsg"></div>\n';
  s += '<div class="signature">\n';
  s += '<div class="sig-right"><div>توقيع المربي/ة</div><div id="certTeacher"></div></div>\n';
  s += '<div class="sig-left"><div>توقيع المديرة</div><div>سلوى نعراني</div></div>\n';
  s += '</div>\n</div>\n</div>\n';
  s += '<div id="savedImage" style="display:none;text-align:center;margin:20px auto;max-width:1123px;">\n';
  s += '<p style="font-size:20px;color:#2e7d32;font-weight:bold;">اضغطي مطولاً على الصورة ثم "حفظ الصورة"</p>\n';
  s += '<img id="resultImage" style="width:100%;border:3px solid #d9a066;border-radius:10px;">\n';
  s += '</div>\n</div>\n';

  // scripts - use separate string to avoid browser parsing issues
  var sc = 'scr' + 'ipt';
  s += '<' + sc + ' src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></' + sc + '>\n';
  s += '<' + sc + '>\n';

  // checkbox radio behavior
  s += 'document.querySelectorAll("#evalBody tr").forEach(function(row){\n';
  s += 'var boxes=row.querySelectorAll("input[type=checkbox]");\n';
  s += 'var a=[boxes[0],boxes[1],boxes[2]],b=[boxes[3],boxes[4],boxes[5]];\n';
  s += 'a.forEach(function(c){c.onclick=function(){a.forEach(function(x){if(x!==c)x.checked=false})}});\n';
  s += 'b.forEach(function(c){c.onclick=function(){b.forEach(function(x){if(x!==c)x.checked=false})}});\n';
  s += '});\n';

  // generate function
  s += 'function generate(){\n';
  s += 'var n=document.getElementById("studentName").value;\n';
  s += 'var c=document.getElementById("className").value;\n';
  s += 'var d=document.getElementById("dateField").value;\n';
  s += 'var t=document.getElementById("teacherName").value;\n';
  s += 'if(!n||!c||!d||!t){alert("الرجاء تعبئة جميع الحقول");return}\n';
  s += 'document.getElementById("certStudent").innerText="فارس/ة التحدي والإرادة، الطالب/ة: "+n;\n';
  s += 'document.getElementById("certClass").innerText="الصف: "+c;\n';
  s += 'document.getElementById("certDate").innerText="التاريخ: "+d;\n';
  s += 'document.getElementById("certTeacher").innerText=t;\n';
  s += 'var r=document.getElementById("certResult");\n';
  s += 'r.innerHTML="<tr><th>الموضوع</th><th colspan=3>المشاركة</th><th colspan=3>إنجاز المهام</th></tr>';
  s += '<tr><th></th><th>كامل</th><th>جزئي</th><th>لا يشارك</th><th>ينفذ بالكامل</th><th>ينفذ جزئيًا</th><th>لا ينفذ</th></tr>";\n';
  s += 'document.querySelectorAll("#evalBody tr").forEach(function(row){\n';
  s += 'var cells=row.querySelectorAll("td");\n';
  s += 'var boxes=row.querySelectorAll("input[type=checkbox]");\n';
  s += 'var tr="<tr><td><strong>"+cells[0].innerText+"</strong></td>";\n';
  s += "for(var i=0;i<6;i++){tr+=boxes[i].checked?'<td class=\"check\">&#10004;</td>':'<td></td>'}\n";
  s += 'tr+="</tr>";r.innerHTML+=tr});\n';
  s += 'var m="عزيزي الطالب/ عزيزتي الطالبة\\n\\n";\n';
  s += 'm+="بإرادتك تثبت أنك أقوى من كل الظروف وأن إصرارك يزرع الأمل.\\n";\n';
  s += 'm+="اعلم أن مشاركتك عن بعد ليست مجرد متابعة للدراسة، بل هي قصة شجاعة وصمود نحو النجاح.\\n";\n';
  s += 'm+="لا تتخلَّ عن أحلامك ومستقبلك";\n';
  s += 'document.getElementById("certMsg").innerText=m;\n';
  s += 'document.getElementById("cert").style.display="block";\n';
  s += 'document.getElementById("cert").scrollIntoView({behavior:"smooth"});\n';
  s += '}\n';

  // save as image - show below certificate
  s += 'function saveAsImage(){\n';
  s += 'var cert=document.getElementById("cert");\n';
  s += 'if(cert.style.display==="none"){alert("أنشئ الشهادة أولاً");return}\n';
  s += 'html2canvas(cert,{scale:2,useCORS:true,allowTaint:true}).then(function(canvas){\n';
  s += 'document.getElementById("resultImage").src=canvas.toDataURL("image/png");\n';
  s += 'document.getElementById("savedImage").style.display="block";\n';
  s += 'document.getElementById("savedImage").scrollIntoView({behavior:"smooth"});\n';
  s += '})}\n';

  s += '</' + sc + '>\n</body>\n</html>';
  return s;
}
</script>
</body>
</html>
