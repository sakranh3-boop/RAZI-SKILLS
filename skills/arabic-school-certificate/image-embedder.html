<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>أداة تضمين الصور</title>
<style>
body { font-family: Arial; background: #fdf6e3; padding: 40px; text-align: center; direction: rtl; }
.box { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
h1 { color: #855E42; }
label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 18px; }
input { margin: 10px 0; }
button { background: #d9a066; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
button:hover { background: #c48942; }
.status { margin-top: 15px; color: #2e7d32; font-weight: bold; }
img.preview { max-width: 200px; margin: 10px; border: 2px solid #ccc; border-radius: 8px; }
</style>
</head>
<body>
<div class="box">
<h1>أداة تضمين خلفية الشهادة</h1>
<p>ارفعي صورة الخلفية ثم اضغطي الزر لتحميل ملف الشهادة النهائي</p>

<label>خلفية الشهادة:</label>
<input type="file" id="bgFile" accept="image/*">
<img id="bgPreview" class="preview" style="display:none">

<br>
<button onclick="generateFile()">إنشاء ملف الشهادة النهائي</button>
<div class="status" id="status"></div>
</div>

<script>
var bgData = '';

document.getElementById('bgFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    bgData = ev.target.result;
    document.getElementById('bgPreview').src = bgData;
    document.getElementById('bgPreview').style.display = 'inline';
  };
  reader.readAsDataURL(file);
});

function generateFile() {
  if (!bgData) {
    alert('الرجاء رفع صورة الخلفية أولاً');
    return;
  }

  var parts = [];
  parts.push('<!DOCTYPE html>');
  parts.push('<html lang="ar" dir="rtl">');
  parts.push('<head>');
  parts.push('<meta charset="UTF-8">');
  parts.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
  parts.push('<title>شهادة صناع الأمل</title>');
  parts.push('<style>');
  parts.push('body { font-family: Arial; background: #fdf6e3; margin: 0; direction: rtl; }');
  parts.push('.container { max-width: 1150px; margin: auto; padding: 20px; }');
  parts.push('h1 { text-align: center; color: #855E42; }');
  parts.push('form { background: #fff3e0; padding: 20px; border-radius: 10px; }');
  parts.push('label { display: inline-block; margin: 5px 0; }');
  parts.push('input[type="text"], input[type="date"] { padding: 5px; width: 200px; }');
  parts.push('table { width: 100%; border-collapse: collapse; margin: 10px 0; }');
  parts.push('th, td { border: 1px solid #855E42; padding: 6px; text-align: center; }');
  parts.push('th { background: #f5deb3; }');
  parts.push('button { background: #d9a066; color: #fff; padding: 10px 20px; border: none; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }');
  parts.push('button:hover { background: #c48942; }');
  parts.push('.certificate { width: 1123px; height: 794px; position: relative; margin: 20px auto; display: none; overflow: hidden; background: white; border-radius: 15px; box-shadow: 0 0 15px rgba(170,130,90,0.4); direction: rtl; }');
  parts.push('.bg { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 1; z-index: 0; }');
  parts.push('.content { position: absolute; z-index: 1; top: 18%; left: 35%; width: 60%; height: 72%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; direction: rtl; padding: 5px 10px; }');
  parts.push('.content h2 { color: #6B4E71; margin: 3px 0; font-size: 22px; }');
  parts.push('.content h3 { color: #855E42; margin: 2px 0; font-size: 15px; }');
  parts.push('.student-name { font-size: 17px; font-weight: bold; color: #6B4E71; margin: 3px 0; }');
  parts.push('.cert-class { font-size: 14px; margin: 2px 0; }');
  parts.push('.cert-date { font-size: 14px; margin: 2px 0; }');
  parts.push('.content table { direction: rtl; width: 100%; }');
  parts.push('.content th, .content td { font-size: 10px; padding: 2px 3px; direction: rtl; text-align: center; border: 1px solid #855E42; }');
  parts.push('.content th { background: rgba(245,222,179,0.7); }');
  parts.push('.content td { background: rgba(255,255,255,0.5); }');
  parts.push('.content td.check { color: #2e7d32; font-size: 14px; font-weight: bold; }');
  parts.push('.message { padding: 3px; white-space: pre-line; font-size: 11px; font-weight: bold; color: #6B4E71; line-height: 1.3; width: 100%; margin: 3px 0; direction: rtl; text-align: center; }');
  parts.push('.signature { display: flex; justify-content: space-between; width: 100%; direction: rtl; }');
  parts.push('.signature div { text-align: center; width: 45%; font-size: 12px; }');
  parts.push('.sig-name { font-size: 12px; }');
  parts.push('@media print { form, h1, button { display: none; } .certificate { box-shadow: none; } }');
  parts.push('</style>');
  parts.push('</head>');
  parts.push('<body>');
  parts.push('<div class="container">');
  parts.push('<h1>نموذج تقييم الطالب - مدرسة بسمة طبعون الابتدائية</h1>');
  parts.push('<form>');
  parts.push('<label>اسم الطالب: <input type="text" id="studentName"></label><br>');
  parts.push('<label>الصف: <input type="text" id="className"></label><br>');
  parts.push('<label>التاريخ: <input type="date" id="dateField"></label><br>');
  parts.push('<label>اسم المربي/ة: <input type="text" id="teacherName"></label><br>');
  parts.push('<table id="evalTable"><thead>');
  parts.push('<tr><th>الموضوع</th><th colspan="3">المشاركة</th><th colspan="3">إنجاز المهام</th></tr>');
  parts.push('<tr><th></th><th>كامل</th><th>جزئي</th><th>لا يشارك</th><th>ينفذ بالكامل</th><th>ينفذ جزئيًا</th><th>لا ينفذ</th></tr>');
  parts.push('</thead><tbody id="evalBody">');
  var subjects = ['اللغة العربية', 'اللغة العبرية', 'اللغة الإنجليزية', 'رياضيات', 'علوم'];
  for (var s = 0; s < subjects.length; s++) {
    parts.push('<tr><td>' + subjects[s] + '</td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td></tr>');
  }
  parts.push('</tbody></table>');
  parts.push('<button type="button" onclick="generate()">إنشاء الشهادة</button>');
  parts.push('<button type="button" onclick="download()">تحميل PDF</button>');
  parts.push('</form>');
  parts.push('<div id="cert" class="certificate">');
  parts.push('<img class="bg" src="' + bgData + '">');
  parts.push('<div class="content">');
  parts.push('<h2>مدرسة بسمة طبعون الابتدائية</h2>');
  parts.push('<h3>شهادة صناع الأمل في حرب زئير الأسد للفصل الثاني 2026</h3>');
  parts.push('<div class="student-name" id="certStudent"></div>');
  parts.push('<div class="cert-class" id="certClass"></div>');
  parts.push('<div class="cert-date" id="certDate"></div>');
  parts.push('<table id="certResult"></table>');
  parts.push('<div class="message" id="certMsg"></div>');
  parts.push('<div class="signature">');
  parts.push('<div><div class="sig-name">توقيع المربي/ة: <span id="certTeacher"></span></div></div>');
  parts.push('<div><div class="sig-name">توقيع المديرة: سلوى نعراني</div></div>');
  parts.push('</div>');
  parts.push('</div>');
  parts.push('</div>');
  parts.push('</div>');

  parts.push('<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></scr' + 'ipt>');
  parts.push('<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></scr' + 'ipt>');
  parts.push('<scr' + 'ipt>');
  parts.push('document.querySelectorAll("#evalBody tr").forEach(function(row) {');
  parts.push('  var boxes = row.querySelectorAll("input[type=checkbox]");');
  parts.push('  var p = [boxes[0], boxes[1], boxes[2]];');
  parts.push('  var t = [boxes[3], boxes[4], boxes[5]];');
  parts.push('  p.forEach(function(c) { c.onclick = function() { p.forEach(function(x) { if (x !== c) x.checked = false; }); }; });');
  parts.push('  t.forEach(function(c) { c.onclick = function() { t.forEach(function(x) { if (x !== c) x.checked = false; }); }; });');
  parts.push('});');
  parts.push('function generate() {');
  parts.push('  var name = document.getElementById("studentName").value;');
  parts.push('  var cls = document.getElementById("className").value;');
  parts.push('  var dt = document.getElementById("dateField").value;');
  parts.push('  var teacher = document.getElementById("teacherName").value;');
  parts.push('  if (!name || !cls || !dt || !teacher) { alert("الرجاء تعبئة جميع الحقول"); return; }');
  parts.push('  document.getElementById("certStudent").innerText = "فارس/ة التحدي والإرادة، الطالب/ة: " + name;');
  parts.push('  document.getElementById("certClass").innerText = "الصف: " + cls;');
  parts.push('  document.getElementById("certDate").innerText = "التاريخ: " + dt;');
  parts.push('  document.getElementById("certTeacher").innerText = teacher;');
  parts.push('  var result = document.getElementById("certResult");');
  parts.push('  result.innerHTML = "<tr><th>الموضوع</th><th colspan=3>المشاركة</th><th colspan=3>إنجاز المهام</th></tr><tr><th></th><th>كامل</th><th>جزئي</th><th>لا يشارك</th><th>ينفذ بالكامل</th><th>ينفذ جزئيًا</th><th>لا ينفذ</th></tr>";');
  parts.push('  document.querySelectorAll("#evalBody tr").forEach(function(row) {');
  parts.push('    var cells = row.querySelectorAll("td");');
  parts.push('    var boxes = row.querySelectorAll("input[type=checkbox]");');
  parts.push('    var tr = "<tr><td><strong>" + cells[0].innerText + "</strong></td>";');
  parts.push('    for (var i = 0; i < 6; i++) { tr += boxes[i].checked ? \'<td class="check">&#10004;</td>\' : "<td></td>"; }');
  parts.push('    tr += "</tr>";');
  parts.push('    result.innerHTML += tr;');
  parts.push('  });');
  parts.push('  var msg = "عزيزي الطالب/ عزيزتي الطالبة\\n";');
  parts.push('  msg += "بإرادتك تثبت أنك أقوى من كل الظروف وأن إصرارك يزرع الأمل.\\n";');
  parts.push('  msg += "اعلم أن مشاركتك عن بعد ليست مجرد متابعة للدراسة، بل هي قصة شجاعة وصمود نحو النجاح.\\n";');
  parts.push('  msg += "لا تتخلَّ عن أحلامك ومستقبلك\\n";');
  parts.push('  msg += "مديرة المدرسة\\n";');
  parts.push('  msg += "سلوى نعراني";');
  parts.push('  document.getElementById("certMsg").innerText = msg;');
  parts.push('  document.getElementById("cert").style.display = "block";');
  parts.push('  document.getElementById("cert").scrollIntoView({ behavior: "smooth" });');
  parts.push('}');
  parts.push('function download() {');
  parts.push('  var cert = document.getElementById("cert");');
  parts.push('  html2canvas(cert, { scale: 3, useCORS: true }).then(function(canvas) {');
  parts.push('    var jsPDF = window.jspdf.jsPDF;');
  parts.push('    var pdf = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });');
  parts.push('    var w = pdf.internal.pageSize.getWidth();');
  parts.push('    var h = pdf.internal.pageSize.getHeight();');
  parts.push('    pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, w, h);');
  parts.push('    pdf.save("شهادة الطالب.pdf");');
  parts.push('  });');
  parts.push('}');
  parts.push('</scr' + 'ipt>');
  parts.push('</body>');
  parts.push('</html>');

  var html = parts.join('\n');

  var blob = new Blob([html], { type: 'text/html; charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'شهادة-صناع-الأمل.html';
  a.click();

  document.getElementById('status').innerText = 'تم إنشاء الملف! تحققي من مجلد التحميلات.';
}
</script>
</body>
</html>
